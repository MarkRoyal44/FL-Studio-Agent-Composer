[package]
name = "agent_composer_plugin"
version = "0.7.0"
edition = "2021"
license-file = "../LICENSE"
description = "Agent Composer as a CLAP plugin: the chat window inside FL Studio"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", default-features = false }
wry = "0.57"
raw-window-handle = "0.6"

[profile.release]
lto = "thin"
strip = true
